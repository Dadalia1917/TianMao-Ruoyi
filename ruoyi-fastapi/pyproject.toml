[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmall-smart-home-assistant"
version = "1.2.0"
description = "Tmall Smart Home realtime voice, chat, memory, and household-agent gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "websockets>=15,<18",
    "httpx>=0.28,<1.0",
    "aiomysql>=0.2,<1.0",
    "redis>=5.2,<7.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["assistant_server*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
show-fixes = true

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "FAST", "I", "RUF006", "UP"]
ignore = [
    "B008",  # FastAPI dependency declarations intentionally call Depends at import time.
    "UP038", # Tuple isinstance checks remain compatible with the Python 3.11 fallback.
]

[tool.ruff.lint.isort]
known-first-party = ["assistant_server"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

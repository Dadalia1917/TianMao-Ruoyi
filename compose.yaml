name: tmall-smart-home

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/docker/.env 中配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ry-cat
      MYSQL_USER: ${MYSQL_APP_USER:-tmall_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?请在 deploy/docker/.env 中配置 MYSQL_APP_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/ry-cat.sql:/docker-entrypoint-initdb.d/01-ry-cat.sql:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/docker/.env 中配置 REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  java:
    build:
      context: .
      dockerfile: deploy/docker/java.Dockerfile
    image: tmall-smart-home/java-api:1.1.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8}
      SPRING_PROFILES_ACTIVE: druid
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/ry-cat?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: ${MYSQL_APP_USER:-tmall_app}
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_APP_PASSWORD}
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_ENABLED: "false"
      SPRING_DATASOURCE_DRUID_WEBSTATFILTER_ENABLED: "false"
      SPRING_DATASOURCE_DRUID_FILTER_WALL_CONFIG_MULTISTATEMENTALLOW: "false"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RUOYI_PROFILE: /app/data/uploadPath
      TOKEN_SECRET: ${TOKEN_SECRET:?请在 deploy/docker/.env 中配置 TOKEN_SECRET}
      LOGGING_LEVEL_COM_RUOYI: ${JAVA_LOG_LEVEL:-info}
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      SERVER_TOMCAT_THREADS_MAX: "200"
      SERVER_TOMCAT_THREADS_MINSPARE: "20"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - java_data:/app/data
      - java_logs:/app/logs
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/captchaImage >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  fastapi:
    build:
      context: .
      dockerfile: deploy/docker/fastapi.Dockerfile
    image: tmall-smart-home/ai-gateway:1.1.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请在 deploy/docker/.env 中配置 DASHSCOPE_API_KEY}
      DASHSCOPE_REALTIME_URL: ${DASHSCOPE_REALTIME_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3.5-omni-plus-realtime}
      DASHSCOPE_VOICE: ${DASHSCOPE_VOICE:-Ethan}
      GENIE_PROVIDER_ENABLED: ${GENIE_PROVIDER_ENABLED:-true}
      ACOUSTIC_RELAY_ENABLED: ${ACOUSTIC_RELAY_ENABLED:-false}
      ACOUSTIC_RELAY_WAKE_PHRASE: ${ACOUSTIC_RELAY_WAKE_PHRASE:-天猫精灵}
      HOST: 0.0.0.0
      PORT: "8001"
      LOG_LEVEL: ${FASTAPI_LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      FASTAPI_WORKERS: ${FASTAPI_WORKERS:-2}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-150}
      MAX_CONNECTIONS_PER_USER: ${MAX_CONNECTIONS_PER_USER:-3}
      UPSTREAM_ROTATE_SECONDS: ${UPSTREAM_ROTATE_SECONDS:-6900}
      CLIENT_EVENT_MAX_BYTES: "262144"
      CLIENT_QUEUE_SIZE: "256"
      RUOYI_AUTH_URL: http://java:8080/getInfo
      RUOYI_AUTH_CACHE_SECONDS: "60"
      DATABASE_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ry-cat
      MYSQL_USER: ${MYSQL_APP_USER:-tmall_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_POOL_MIN_SIZE: ${MYSQL_POOL_MIN_SIZE:-2}
      MYSQL_POOL_MAX_SIZE: ${MYSQL_POOL_MAX_SIZE:-10}
      DATABASE_QUEUE_SIZE: ${DATABASE_QUEUE_SIZE:-10000}
      DATABASE_WORKERS: ${DATABASE_WORKERS:-2}
      VOICE_STORE_TRANSCRIPTS: ${VOICE_STORE_TRANSCRIPTS:-false}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_API_URL: ${MEMORY_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      MEMORY_MODEL: ${MEMORY_MODEL:-qwen-plus}
      MEMORY_CACHE_SECONDS: "300"
      MEMORY_MAX_ITEMS: "50"
      MEMORY_QUEUE_SIZE: "2000"
      MEMORY_WORKERS: ${MEMORY_WORKERS:-2}
      MEMORY_EXTRACTION_MAX_CHARS: "16000"
      TEXT_CHAT_ENABLED: ${TEXT_CHAT_ENABLED:-true}
      TEXT_CHAT_API_URL: ${TEXT_CHAT_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      TEXT_MODEL_QWEN38: ${TEXT_MODEL_QWEN38:-qwen3.8-max}
      TEXT_MODEL_QWEN37: ${TEXT_MODEL_QWEN37:-qwen3.7-plus-2026-05-26}
      TEXT_MODEL_QWEN37_FLASH: ${TEXT_MODEL_QWEN37_FLASH:-qwen3.7-flash-2026-07-15}
      TEXT_MODEL_DEEPSEEK: ${TEXT_MODEL_DEEPSEEK:-deepseek-v4-flash-0731}
      TEXT_MODEL_DEEPSEEK_PRO: ${TEXT_MODEL_DEEPSEEK_PRO:-deepseek-v4-pro}
      TEXT_MODEL_DEEPSEEK_R1: ${TEXT_MODEL_DEEPSEEK_R1:-deepseek-r1-0528}
      TEXT_MAX_CONNECTIONS: ${TEXT_MAX_CONNECTIONS:-100}
      TEXT_MAX_CONNECTIONS_PER_USER: ${TEXT_MAX_CONNECTIONS_PER_USER:-3}
      TEXT_REQUEST_MAX_BYTES: ${TEXT_REQUEST_MAX_BYTES:-524288}
      TEXT_MAX_MESSAGES: ${TEXT_MAX_MESSAGES:-30}
      TEXT_MAX_CHARS: ${TEXT_MAX_CHARS:-60000}
      TEXT_TIMEOUT_SECONDS: ${TEXT_TIMEOUT_SECONDS:-240}
    expose:
      - "8001"
    depends_on:
      java:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - exec uvicorn main:app --host 0.0.0.0 --port 8001 --workers "$${FASTAPI_WORKERS:-2}" --proxy-headers --forwarded-allow-ips="*"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: deploy/docker/gateway.Dockerfile
    image: tmall-smart-home/web-gateway:1.1.0
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-http://:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      java:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  java_data:
  java_logs:
  caddy_data:
  caddy_config:
